name: Companion Android app

on:
  push:
    branches: [main]
    paths: ["companion-android/**", ".github/workflows/companion_android.yml"]
  pull_request:
    paths: ["companion-android/**", ".github/workflows/companion_android.yml"]
  workflow_dispatch:

concurrency:
  group: companion-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: companion-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms itself.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test
      # The signing key lives in repository secrets (COMPANION_KEYSTORE_BASE64, COMPANION_KEYSTORE_PASSWORD).
      # Gradle runs the checked-out build scripts, so the key is only restored for main: a pull request
      # (even from a branch of this repository) could otherwise change those scripts to read it.
      # Pull requests and builds without the secrets are signed with a throwaway debug key.
      - name: Restore signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/companion.keystore"
            echo "COMPANION_KEYSTORE=$RUNNER_TEMP/companion.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing secret: building with the debug key."
          fi
      - name: Build APK
        env:
          COMPANION_KEYSTORE_PASSWORD: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && secrets.COMPANION_KEYSTORE_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Report signing
        id: signed
        run: echo "signed=${SIGNED:-0}" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UnifiedMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UnifiedMonitor-apk
          path: companion-android/UnifiedMonitor.apk

  # Keeps one always-current download link for installing on a phone.
  publish:
    # Only a build signed with the release key is published, so phones can update in place.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UnifiedMonitor-apk
      - name: Update the companion-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete companion-latest --yes --cleanup-tag || true
          gh release create companion-latest UnifiedMonitor.apk --prerelease --target "$GITHUB_SHA" \
            --title "Unified Monitor (Android) – latest" \
            --notes "Android companion app built from $GITHUB_SHA. Open this page on your phone, tap UnifiedMonitor.apk, and allow installing from your browser."
