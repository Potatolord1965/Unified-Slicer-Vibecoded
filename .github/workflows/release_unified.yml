name: Release Unified Slicer

# Publishes the Windows and macOS builds of a "Build all" run as a GitHub release
# named after UNIFIED_VERSION in version.inc. The asset names are what the in-app
# updater looks for (UnifiedSlicer-<version>-win64.zip, its .sha256 and the
# .sha256.sig signature), so keep them in step with UnifiedUpdater.cpp.
#
# The updater only installs a package whose .sha256 is signed with the Ed25519 key
# in the UPDATE_SIGNING_KEY secret (PEM); its public half is RELEASE_PUBLIC_KEY in
# src/slic3r/Utils/UpdateSignature.cpp. Without the secret the release is still
# published, and the app links to its page instead of installing it.
#
# Trigger: Actions tab -> "Release Unified Slicer" -> Run workflow. Leave run_id
# empty to use the latest successful "Build all" run on main. A version that is
# already released is only replaced when "replace" is ticked: installed copies
# never see a changed package under the same version, so bump UNIFIED_VERSION.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the "Build all" workflow (empty = latest successful run on main)'
        required: false
        type: string
      replace:
        description: 'Replace the assets of an existing release of this version'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create the release and upload assets
  actions: read     # download artifacts from another run

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Pick the build run
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
        run: |
          run_id="$RUN_ID_INPUT"
          if [ -n "$run_id" ] && ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a number."
            exit 1
          fi
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$REPO" --workflow build_all.yml --branch main --event push \
                       --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build all run on main found."
            exit 1
          fi
          sha=$(gh run view "$run_id" --repo "$REPO" --json headSha --jq '.headSha')
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "Using run $run_id at $sha"

      - name: Read the version
        run: |
          ver=$(gh api "repos/$REPO/contents/version.inc?ref=$SHA" --jq '.content' | base64 -d |
                grep 'set(UNIFIED_VERSION' | cut -d '"' -f2)
          if [ -z "$ver" ]; then
            echo "::error::UNIFIED_VERSION not found in version.inc at $SHA."
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "Version $ver"

      - name: Download the builds
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --dir artifacts \
            -p 'OrcaSlicer_Windows_V*_x64_portable' \
            -p 'OrcaSlicer_Windows_V*_x64' \
            -p 'OrcaSlicer_Mac_universal_*'
          find artifacts -maxdepth 2 | sort

      - name: Package
        run: |
          mkdir -p dist
          portable=$(find artifacts -maxdepth 1 -type d -name 'OrcaSlicer_Windows_V*_x64_portable' | head -n 1)
          if [ -z "$portable" ]; then
            echo "::error::The run has no Windows x64 build."
            exit 1
          fi
          mv "$portable" "Unified Slicer"
          zip -qr9 "dist/UnifiedSlicer-$VER-win64.zip" "Unified Slicer"
          (cd dist && sha256sum "UnifiedSlicer-$VER-win64.zip" > "UnifiedSlicer-$VER-win64.zip.sha256")

          installer=$(find artifacts -path '*OrcaSlicer_Windows_V*_x64/*' -name '*.exe' | head -n 1)
          if [ -n "$installer" ]; then
            cp "$installer" "dist/UnifiedSlicer-$VER-win64-setup.exe"
          else
            echo "::warning::The run has no Windows installer; releasing the zip only."
          fi

          dmg=$(find artifacts -path '*OrcaSlicer_Mac_universal_*' -name '*.dmg' | head -n 1)
          if [ -n "$dmg" ]; then
            cp "$dmg" "dist/UnifiedSlicer-$VER-mac-universal.dmg"
          else
            echo "::warning::The run has no macOS build; releasing Windows only."
          fi
          ls -l dist

      - name: Sign the checksum
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret: the release is not signed, so the in-app updater will not install it."
            exit 0
          fi
          key="$RUNNER_TEMP/update_signing_key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          # A key the app doesn't know would publish a release no installed copy accepts.
          expected=$(gh api "repos/$REPO/contents/src/slic3r/Utils/UpdateSignature.cpp?ref=$SHA" --jq '.content' | base64 -d |
                     sed -n 's/.*RELEASE_PUBLIC_KEY = "\([^"]*\)".*/\1/p')
          actual=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            rm -f "$key"
            echo "::error::UPDATE_SIGNING_KEY does not match RELEASE_PUBLIC_KEY in src/slic3r/Utils/UpdateSignature.cpp at $SHA."
            exit 1
          fi
          sum="dist/UnifiedSlicer-$VER-win64.zip.sha256"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$sum" | base64 -w0 > "$sum.sig"
          # The same check the app makes, with the public half of the key.
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update_signing_pub.pem"
          base64 -d "$sum.sig" > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update_signing_pub.pem" -rawin -in "$sum" -sigfile "$RUNNER_TEMP/sig.bin"
          rm -f "$key"

      - name: Publish
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          tag="v$VER"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::Release $tag already exists. Bump UNIFIED_VERSION in version.inc, or run again with \"replace\" ticked."
              exit 1
            fi
            gh release upload "$tag" dist/* --repo "$REPO" --clobber
          else
            gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" --title "Unified Slicer $VER" \
              --notes "Built from $SHA (Build all run $RUN_ID).

          **Windows:** run \`UnifiedSlicer-$VER-win64-setup.exe\`. It installs to Program Files with Start menu and desktop shortcuts, and uninstalls from Settings > Apps. Windows SmartScreen may warn that the app is unrecognised: click More info > Run anyway. The \`win64.zip\` is a portable copy (unzip and run \`unified-slicer.exe\`) and is what the in-app updater downloads.

          **macOS:** open \`UnifiedSlicer-$VER-mac-universal.dmg\` and drag the app onto Applications. The app is not notarized, so the first time macOS blocks it: open System Settings > Privacy & Security and click Open Anyway.

          Unified Slicer is unofficial free software, provided as is, with no warranty. It is not affiliated with or endorsed by OrcaSlicer, Bambu Lab, Elegoo, Creality, Markforged, Snapmaker or Unlayered; their names and trademarks belong to their owners. Source code: https://github.com/$REPO/tree/$SHA"
          fi
