<body class="thin-scroll" onLoad="OnInit()">
<div id="LeftBoard">
	<div id="LoginArea">

		<!-- Orca Cloud account -->
		<div id="OrcaAccount" class="AccountRow" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
			 onClick="OnAccountRowClick('orca')">
			<span class="AccountAvatar">
				<img id="UserAvatarIcon" class="AccountAvatarImg" alt="" onerror="OnAvatarLoadError(this)" />
			</span>
			<span class="AccountText">
				<span id="UserName" class="AccountName"></span>
				<span class="AccountSecondary">Orca Cloud</span>
			</span>
			<span class="AccountSignIn" data-i18n="login">Login</span>
			<svg class="AccountChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<path d="M3 4.75L6 7.75L9 4.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>

		<!-- Bambu Cloud, a secondary provider folded away under the main account -->
		<div id="BambuCloudSection">
			<div id="BambuCloudHeader" tabindex="0" role="button" aria-expanded="false" aria-controls="BambuCloudBody"
				 onClick="ToggleBambuSection()">
				<svg class="SectionChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="SectionLabel">Bambu Cloud</span>
				<span id="BambuStatusDot"></span>
			</div>

			<div id="BambuCloudBody">
				<div id="BambuAccount" class="AccountRow AccountRowCompact" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
					 onClick="OnAccountRowClick('bambu')">
					<span class="AccountAvatar">
						<img id="BambuAvatarIcon" class="AccountAvatarImg" alt="" onerror="OnAvatarLoadError(this)" />
					</span>
					<span class="AccountText">
						<span id="BambuUserName" class="AccountName"></span>
						<span class="AccountSecondary" data-i18n="not_signed_in">Not signed in</span>
					</span>
					<span class="AccountSignIn" data-i18n="login">Login</span>
					<svg class="AccountChevron" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path d="M3 4.75L6 7.75L9 4.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>

				<div id="NoPluginTip">
					<div id="NoPluginText" class="RedFont"><a class="LinkBtn" onClick="BeginDownloadNetworkPlugin()"></a></div>
				</div>
			</div>
		</div>

		<!-- Shared account menu, anchored under the row it was opened from.
		     The row already carries the avatar, name and provider, so the menu only
		     adds the account handle. -->
		<div id="AccountMenu" role="menu">
			<div id="AccountMenuHandle" role="presentation"></div>
			<div id="AccountMenuLogout" role="menuitem" tabindex="0" onClick="OnAccountMenuLogout()">
				<span id="AccountMenuLogoutIcon"></span>
				<span data-i18n="log_out">Log Out</span>
			</div>
		</div>

	</div>

	<div id="BtnArea">
		<div menu="recent" class="BtnItem BtnItemSelected" title="Recent" data-i18n-title="recent" onClick="GotoMenu('recent')">
			<div class="NavIcon icon20 IconRecent"></div>
			<div class="BtnLabel" data-i18n="recent">Recent</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div menu="orca_cloud" class="BtnItem" title="OrcaCloud" onClick="GotoCloud()">
			<div class="NavIcon icon20 IconCloud"></div>
			<div class="BtnLabel">OrcaCloud</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div class="BtnItem" title="Wiki" onClick="OpenUrlInLocalBrowser('https://orcaslicer.com/wiki')">
			<div class="NavIcon icon20 IconWiki"></div>
			<div class="BtnLabel">Wiki</div>
			<div class="ShortcutIcon icon16"></div>
		</div>
	</div>

	<!-- Model sites open in a native pane beside this column (WebViewPanel::set_model_site).
	     Downloads and "Open in slicer" links in that pane are imported into the plater. -->
	<div id="ModelSiteArea">
		<div class="NavSectionTitle" data-i18n="models">Models</div>
		<div menu="site_unlayered" class="BtnItem" title="Unlayered Universe" onClick="GotoModelSite('unlayered')">
			<div class="SiteBadge SiteUnlayered">U</div>
			<div class="BtnLabel">Unlayered Universe</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div menu="site_makerworld" class="BtnItem" title="MakerWorld" onClick="GotoModelSite('makerworld')">
			<div class="SiteBadge SiteMakerWorld">M</div>
			<div class="BtnLabel">MakerWorld</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div menu="site_nexprint" class="BtnItem" title="Nexprint" onClick="GotoModelSite('nexprint')">
			<div class="SiteBadge SiteNexprint">N</div>
			<div class="BtnLabel">Nexprint</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div menu="site_snapmaker" class="BtnItem" title="Snapmaker Space" onClick="GotoModelSite('snapmaker')">
			<div class="SiteBadge SiteSnapmaker">S</div>
			<div class="BtnLabel">Snapmaker Space</div>
			<div class="NavArrow icon16"></div>
		</div>
		<div menu="site_thingiverse" class="BtnItem" title="Thingiverse" onClick="GotoModelSite('thingiverse')">
			<div class="SiteBadge SiteThingiverse">T</div>
			<div class="BtnLabel">Thingiverse</div>
			<div class="NavArrow icon16"></div>
		</div>
	</div>

	<!-- Collapses the column to its icons (ToggleNavCollapsed in js/home.js). -->
	<div id="NavCollapseBtn" class="BtnItem" tabindex="0" role="button" aria-expanded="true"
		 title="Collapse sidebar" onClick="ToggleNavCollapsed()">
		<div class="NavIcon icon20 IconCollapse"></div>
		<div class="BtnLabel" data-i18n="collapse_sidebar">Collapse sidebar</div>
	</div>
</div>

<div id="ContentBoard" class="thin-scroll" board="recent">
    <div style="height: 14px;"></div>	
	<div id="MenuArea">
<!--		<div class="MenuItem" onClick="OnClickModelDepot()">
			<div class="MenuIcon"><img src="img/i6.png"></div>
			<div>
				<div class="trans TextS1" tid="t90">3D Model</div>
				<div class="MenuDesc trans"  tid="t91">Download 3D Models</div>
			</div>
		</div>	-->	
		<div class="MenuItem" onClick="OnClickNewProject()">

			<div>
				<div class="TextS1" data-i18n="new_project">New Project</div>
				<div class="MenuDesc" data-i18n="create_new_project">Create new project</div>
			</div>
		</div>
		<div class="MenuItem" onClick="OnClickOpenProject()">
			<div class="MenuIcon"><img src="img/i5.png"></div>
			<div>
				<div class="TextS1" data-i18n="open_project">Open Project</div>
				<div class="MenuDesc">3mf</div>
			</div>
		</div>

	<div id="DebugText"></div>	
	<div id="RecentFileArea">
		<div id="RecentTitleBlock">
		    <div id="RecentTitle" class="Content-Title TextS1" data-i18n="recently_opened">Recently opened</div>
			<div id="RecentClearAllBtn" class="ButtonStyleRegular ButtonTypeWindow" onClick="OnDeleteAllRecentFiles()" data-i18n="clear_all">Clear all</div>
			<!-- Card or list view, for both lists on this page (SetProjectView in js/home.js). -->
			<div id="ViewSelector" role="radiogroup">
				<div class="ViewButton" view="cards" role="radio" tabindex="0" title="Card view" data-i18n-title="card_view" onClick="SetProjectView('cards')"><div class="icon16"></div></div>
				<div class="ViewButton" view="list" role="radio" tabindex="0" title="List view" data-i18n-title="list_view" onClick="SetProjectView('list')"><div class="icon16"></div></div>
			</div>
		</div>
		<!-- One row of the most recent projects (ApplyRecentRowCap); the rest are under All projects. -->
		<div id="FileList" class="ProjectList">
			<!-- Cards made by ProjectItemHtml in js/home.js -->
		</div>
	</div>

	<div id="AllProjectsArea">
		<div id="ProjectsTitleBlock">
			<div class="Content-Title TextS1" data-i18n="all_projects">All projects</div>
			<div id="ProjectsCount"></div>
			<div id="ProjectsStatus" data-i18n="searching_projects">Searching…</div>
			<div id="ProjectsTools">
				<input id="ProjectsSearch" type="search" placeholder="Search projects" data-i18n-placeholder="search_projects" oninput="RenderAllProjects()" />
				<div id="ProjectsRefreshBtn" class="ButtonStyleRegular ButtonTypeWindow" onClick="OnRefreshProjects()" data-i18n="refresh">Refresh</div>
			</div>
		</div>
		<!-- The folders searched for project files, then the add button. -->
		<div id="ProjectFolders">
			<div id="ProjectFolderChips"></div>
			<div id="AddProjectFolderBtn" class="ButtonStyleConfirm ButtonTypeWindow" onClick="OnAddProjectFolder()" data-i18n="add_folder">Add folder</div>
		</div>
		<div id="ProjectsEmpty"></div>
		<div id="ProjectList" class="ProjectList"></div>
	</div>

    <div style="height: 14px;"></div>

		<div id="CT_Folder_Bar" class="CT_Item " onClick="OnExploreRecentFile()" >
			<div class="CT_Icon CT_Explore"></div>
			<div class="CT_Text" data-i18n="open_containing_folder">Open Containing Folder</div>
		</div>				
    </div>

</div>

</div>

<script type="text/javascript">
	//HandleStudio(TestData);
    document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		// Text fields (the project search) keep their keys, editing shortcuts included.
		if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA"))
			return;

		if (e.ctrlKey && e.metaKey)
			OutputKey(e.keyCode, true, false, true);
		else if (e.ctrlKey)
			OutputKey(e.keyCode, true, false, false);
		else if (e.metaKey)
			OutputKey(e.keyCode, false, false, true);

		if (e.shiftKey && e.ctrlKey)
			OutputKey(e.keyCode, true, true, false);

		if (e.shiftKey && e.metaKey)
			OutputKey(e.keyCode, false, true, true);

		if (window.event) {
			try { e.keyCode = 0; } catch (e) { }
			e.returnValue = false;
		}
	};

	window.addEventListener('mousewheel', function (event) {
		if (event.ctrlKey === true || event.metaKey) {
			event.preventDefault();
		}
	}, { passive: false });

</script>
